# Construye la imagen de produccion de la consola (SuperAdmin) EN GitHub (runners con RAM de
# sobra, sin el OOM del host de prod) y la publica en GHCR. Prod luego solo hace `pull` + `up`
# (ver deploy/docker-prod/docker-compose.image.yml + actualizar-en-linux.sh), en ~1 min.
#
# Dispara SOLO en push al tronco (fase-0/clon-backbone): el espejo a `main` del doble push NO
# vuelve a construir (evita imagen doble). pr-check.yml sigue corriendo los gates aparte.
name: publish-image

on:
  push:
    branches: [fase-0/clon-backbone]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "PROGRESO.md"
  workflow_dispatch: {}

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push SuperAdmin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.superadmin
          push: true
          tags: |
            ghcr.io/alexandercuartas665/ecorex/superadmin:latest
            ghcr.io/alexandercuartas665/ecorex/superadmin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
